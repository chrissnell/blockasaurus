openapi: 3.1.1
info:
  title: Blockasaurus config API
  description: Configuration management endpoints for Blockasaurus DNS proxy
  version: '1.0'
servers:
  - url: /api/config
paths:
  /client-groups:
    get:
      operationId: listClientGroups
      tags: [client-groups]
      summary: List all client groups
      responses:
        '200':
          description: List of client groups
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ClientGroup'
  /client-groups/{name}:
    get:
      operationId: getClientGroup
      tags: [client-groups]
      summary: Get a client group by name
      parameters:
        - $ref: '#/components/parameters/ClientGroupName'
      responses:
        '200':
          description: Client group
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientGroup'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      operationId: putClientGroup
      tags: [client-groups]
      summary: Create or update a client group
      parameters:
        - $ref: '#/components/parameters/ClientGroupName'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientGroupInput'
      responses:
        '200':
          description: Saved client group
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientGroup'
        '400':
          $ref: '#/components/responses/BadRequest'
    delete:
      operationId: deleteClientGroup
      tags: [client-groups]
      summary: Delete a client group
      parameters:
        - $ref: '#/components/parameters/ClientGroupName'
      responses:
        '204':
          description: Deleted
        '404':
          $ref: '#/components/responses/NotFound'

  /blocklist-sources:
    get:
      operationId: listBlocklistSources
      tags: [blocklist-sources]
      summary: List blocklist sources
      parameters:
        - name: group_name
          in: query
          schema:
            type: string
        - name: list_type
          in: query
          schema:
            type: string
            enum: [deny, allow]
      responses:
        '200':
          description: List of blocklist sources
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BlocklistSource'
    post:
      operationId: createBlocklistSource
      tags: [blocklist-sources]
      summary: Create a blocklist source
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BlocklistSourceInput'
      responses:
        '201':
          description: Created blocklist source
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BlocklistSource'
        '400':
          $ref: '#/components/responses/BadRequest'
  /blocklist-sources/{id}:
    get:
      operationId: getBlocklistSource
      tags: [blocklist-sources]
      summary: Get a blocklist source by ID
      parameters:
        - $ref: '#/components/parameters/ResourceID'
      responses:
        '200':
          description: Blocklist source
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BlocklistSource'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      operationId: updateBlocklistSource
      tags: [blocklist-sources]
      summary: Update a blocklist source
      parameters:
        - $ref: '#/components/parameters/ResourceID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BlocklistSourceInput'
      responses:
        '200':
          description: Updated blocklist source
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BlocklistSource'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: deleteBlocklistSource
      tags: [blocklist-sources]
      summary: Delete a blocklist source
      parameters:
        - $ref: '#/components/parameters/ResourceID'
      responses:
        '204':
          description: Deleted
        '404':
          $ref: '#/components/responses/NotFound'

  /custom-dns:
    get:
      operationId: listCustomDNSEntries
      tags: [custom-dns]
      summary: List custom DNS entries
      responses:
        '200':
          description: List of custom DNS entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CustomDNSEntry'
    post:
      operationId: createCustomDNSEntry
      tags: [custom-dns]
      summary: Create a custom DNS entry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomDNSEntryInput'
      responses:
        '201':
          description: Created custom DNS entry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomDNSEntry'
        '400':
          $ref: '#/components/responses/BadRequest'
  /custom-dns/{id}:
    get:
      operationId: getCustomDNSEntry
      tags: [custom-dns]
      summary: Get a custom DNS entry by ID
      parameters:
        - $ref: '#/components/parameters/ResourceID'
      responses:
        '200':
          description: Custom DNS entry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomDNSEntry'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      operationId: updateCustomDNSEntry
      tags: [custom-dns]
      summary: Update a custom DNS entry
      parameters:
        - $ref: '#/components/parameters/ResourceID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomDNSEntryInput'
      responses:
        '200':
          description: Updated custom DNS entry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomDNSEntry'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: deleteCustomDNSEntry
      tags: [custom-dns]
      summary: Delete a custom DNS entry
      parameters:
        - $ref: '#/components/parameters/ResourceID'
      responses:
        '204':
          description: Deleted
        '404':
          $ref: '#/components/responses/NotFound'

  /domain-entries:
    get:
      operationId: listDomainEntries
      tags: [domain-entries]
      summary: List domain entries
      parameters:
        - name: entry_type
          in: query
          schema:
            type: string
            enum: [exact_deny, regex_deny, exact_allow, regex_allow]
      responses:
        '200':
          description: List of domain entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DomainEntry'
    post:
      operationId: createDomainEntry
      tags: [domain-entries]
      summary: Create a domain entry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DomainEntryInput'
      responses:
        '201':
          description: Created domain entry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomainEntry'
        '400':
          $ref: '#/components/responses/BadRequest'
  /domain-entries/{id}:
    get:
      operationId: getDomainEntry
      tags: [domain-entries]
      summary: Get a domain entry by ID
      parameters:
        - $ref: '#/components/parameters/ResourceID'
      responses:
        '200':
          description: Domain entry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomainEntry'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      operationId: updateDomainEntry
      tags: [domain-entries]
      summary: Update a domain entry
      parameters:
        - $ref: '#/components/parameters/ResourceID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DomainEntryInput'
      responses:
        '200':
          description: Updated domain entry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomainEntry'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: deleteDomainEntry
      tags: [domain-entries]
      summary: Delete a domain entry
      parameters:
        - $ref: '#/components/parameters/ResourceID'
      responses:
        '204':
          description: Deleted
        '404':
          $ref: '#/components/responses/NotFound'

  /block-settings:
    get:
      operationId: getBlockSettings
      tags: [block-settings]
      summary: Get block settings
      responses:
        '200':
          description: Current block settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BlockSettings'
    put:
      operationId: putBlockSettings
      tags: [block-settings]
      summary: Update block settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BlockSettingsInput'
      responses:
        '200':
          description: Updated block settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BlockSettings'
        '400':
          $ref: '#/components/responses/BadRequest'

  /rebinding-settings:
    get:
      operationId: getRebindingSettings
      tags: [rebinding-settings]
      summary: Get DNS rebinding protection settings
      responses:
        '200':
          description: Current rebinding protection settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RebindingSettings'
    put:
      operationId: putRebindingSettings
      tags: [rebinding-settings]
      summary: Update DNS rebinding protection settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RebindingSettingsInput'
      responses:
        '200':
          description: Updated rebinding protection settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RebindingSettings'
        '400':
          $ref: '#/components/responses/BadRequest'

  /http3-settings:
    get:
      operationId: getHttp3Settings
      tags: [http3-settings]
      summary: Get DoH3 (DNS-over-HTTP/3) settings and listener state
      responses:
        '200':
          description: Stored DoH3 setting plus the state of the running listener
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTP3Settings'
    put:
      operationId: putHttp3Settings
      tags: [http3-settings]
      summary: Update the DoH3 (DNS-over-HTTP/3) setting
      description: >-
        Takes effect on the next restart. The HTTP/3 listener binds at startup and
        is not rebound by POST /apply, so the response still reports the listener
        state of the running process.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HTTP3SettingsInput'
      responses:
        '200':
          description: Updated DoH3 setting plus the state of the running listener
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTP3Settings'
        '400':
          $ref: '#/components/responses/BadRequest'

  /upstream-groups:
    get:
      operationId: listUpstreamGroups
      tags: [upstream-groups]
      summary: List all upstream groups
      responses:
        '200':
          description: List of upstream groups
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UpstreamGroup'
  /upstream-groups/{name}:
    get:
      operationId: getUpstreamGroup
      tags: [upstream-groups]
      summary: Get an upstream group by name
      parameters:
        - $ref: '#/components/parameters/UpstreamGroupName'
      responses:
        '200':
          description: Upstream group
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpstreamGroup'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      operationId: putUpstreamGroup
      tags: [upstream-groups]
      summary: Create or update an upstream group
      parameters:
        - $ref: '#/components/parameters/UpstreamGroupName'
      responses:
        '200':
          description: Saved upstream group
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpstreamGroup'
        '400':
          $ref: '#/components/responses/BadRequest'
    delete:
      operationId: deleteUpstreamGroup
      tags: [upstream-groups]
      summary: Delete an upstream group (default group cannot be deleted)
      parameters:
        - $ref: '#/components/parameters/UpstreamGroupName'
      responses:
        '204':
          description: Deleted
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /upstream-groups/{name}/servers:
    get:
      operationId: listUpstreamServers
      tags: [upstream-groups]
      summary: List servers in an upstream group
      parameters:
        - $ref: '#/components/parameters/UpstreamGroupName'
      responses:
        '200':
          description: List of upstream servers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UpstreamServer'
    post:
      operationId: createUpstreamServer
      tags: [upstream-groups]
      summary: Add a server to an upstream group
      parameters:
        - $ref: '#/components/parameters/UpstreamGroupName'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpstreamServerInput'
      responses:
        '201':
          description: Created upstream server
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpstreamServer'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /upstream-groups/{name}/servers/{id}:
    put:
      operationId: updateUpstreamServer
      tags: [upstream-groups]
      summary: Update an upstream server
      parameters:
        - $ref: '#/components/parameters/UpstreamGroupName'
        - $ref: '#/components/parameters/ResourceID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpstreamServerInput'
      responses:
        '200':
          description: Updated upstream server
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpstreamServer'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: deleteUpstreamServer
      tags: [upstream-groups]
      summary: Delete an upstream server
      parameters:
        - $ref: '#/components/parameters/UpstreamGroupName'
        - $ref: '#/components/parameters/ResourceID'
      responses:
        '204':
          description: Deleted
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /upstream-settings:
    get:
      operationId: getUpstreamSettings
      tags: [upstream-settings]
      summary: Get global upstream settings
      responses:
        '200':
          description: Current upstream settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpstreamSettings'
    put:
      operationId: putUpstreamSettings
      tags: [upstream-settings]
      summary: Update global upstream settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpstreamSettingsInput'
      responses:
        '200':
          description: Updated upstream settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpstreamSettings'
        '400':
          $ref: '#/components/responses/BadRequest'

  /query-log/history:
    get:
      operationId: getQueryLogHistory
      tags: [query-log]
      summary: Search the persisted query log
      description: >
        Returns persisted query log entries, newest first. Reads the database the
        query log writer feeds, so it covers the full retention window rather
        than the live in-memory buffer. Only available when queryLog.type is a
        local database (sqlite); any other target answers 503 so the caller can
        say why history is empty instead of showing no results.
      parameters:
        - name: client
          in: query
          description: Substring match on the client IP or the resolved client name
          schema:
            type: string
        - name: domain
          in: query
          description: Substring match on the queried domain
          schema:
            type: string
        - name: from
          in: query
          description: Inclusive lower bound on the request timestamp
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          description: Exclusive upper bound on the request timestamp
          schema:
            type: string
            format: date-time
        - name: blocked_only
          in: query
          description: Keep only entries blocked by policy (response type BLOCKED)
          schema:
            type: boolean
        - name: limit
          in: query
          description: Page size
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
        - name: cursor
          in: query
          description: >
            Opaque continuation token taken verbatim from a previous response's
            next_cursor. Its contents are not part of this contract.
          schema:
            type: string
      responses:
        '200':
          description: One page of query log entries, newest first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueryLogHistoryPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /apply:
    post:
      operationId: applyConfig
      tags: [apply]
      summary: Apply pending configuration changes
      description: Rebuilds the resolver chain from the current DB state
      responses:
        '200':
          description: Configuration applied successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplyResponse'
        '500':
          description: Apply failed (DB changes preserved, old chain stays active)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplyResponse'

components:
  parameters:
    ClientGroupName:
      name: name
      in: path
      required: true
      schema:
        type: string
    UpstreamGroupName:
      name: name
      in: path
      required: true
      schema:
        type: string
    ResourceID:
      name: id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1

  responses:
    BadRequest:
      description: Validation error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ServiceUnavailable:
      description: The feature is not available in the current configuration
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    ClientGroup:
      type: object
      required: [id, name, slug, clients, groups]
      properties:
        id:
          type: integer
        name:
          type: string
        slug:
          type: string
        clients:
          type: array
          items:
            type: string
        groups:
          type: array
          items:
            type: string

    ClientGroupInput:
      type: object
      properties:
        clients:
          type: array
          items:
            type: string
        groups:
          type: array
          items:
            type: string

    BlocklistSource:
      type: object
      required: [id, group_name, list_type, source_type, source, enabled]
      properties:
        id:
          type: integer
        group_name:
          type: string
        list_type:
          type: string
          enum: [deny, allow]
        source_type:
          type: string
          enum: [http, file, text]
        source:
          type: string
        enabled:
          type: boolean

    BlocklistSourceInput:
      type: object
      required: [group_name, list_type, source_type, source, enabled]
      properties:
        group_name:
          type: string
        list_type:
          type: string
          enum: [deny, allow]
        source_type:
          type: string
          enum: [http, file, text]
        source:
          type: string
        enabled:
          type: boolean

    CustomDNSEntry:
      type: object
      required: [id, domain, record_type, value, ttl, enabled]
      properties:
        id:
          type: integer
        domain:
          type: string
        record_type:
          type: string
          enum: [A, AAAA, CNAME]
        value:
          type: string
        ttl:
          type: integer
          minimum: 0
          maximum: 4294967295
        enabled:
          type: boolean

    CustomDNSEntryInput:
      type: object
      required: [domain, record_type, value, ttl, enabled]
      properties:
        domain:
          type: string
        record_type:
          type: string
          enum: [A, AAAA, CNAME]
        value:
          type: string
        ttl:
          type: integer
          minimum: 0
          maximum: 4294967295
        enabled:
          type: boolean

    DomainEntry:
      type: object
      required: [id, domain, entry_type, comment, enabled, group_name]
      properties:
        id:
          type: integer
        domain:
          type: string
        entry_type:
          type: string
          enum: [exact_deny, regex_deny, exact_allow, regex_allow]
        comment:
          type: string
        enabled:
          type: boolean
        group_name:
          type: string

    DomainEntryInput:
      type: object
      required: [domain, entry_type, enabled]
      properties:
        domain:
          type: string
        entry_type:
          type: string
          enum: [exact_deny, regex_deny, exact_allow, regex_allow]
        comment:
          type: string
        enabled:
          type: boolean

    BlockSettings:
      type: object
      required: [block_type, block_ttl]
      properties:
        block_type:
          type: string
        block_ttl:
          type: string

    BlockSettingsInput:
      type: object
      required: [block_type, block_ttl]
      properties:
        block_type:
          type: string
        block_ttl:
          type: string

    RebindingSettings:
      type: object
      required: [enabled, allowed_domains]
      properties:
        enabled:
          type: boolean
        allowed_domains:
          type: array
          items:
            type: string

    RebindingSettingsInput:
      type: object
      required: [enabled, allowed_domains]
      properties:
        enabled:
          type: boolean
        allowed_domains:
          description: >-
            Plain domain names that may resolve to non-public addresses. Each entry
            also matches its subdomains. Wildcards, regexes and whitespace are
            rejected.
          type: array
          items:
            type: string

    HTTP3Settings:
      type: object
      required: [enabled, active, restart_required]
      properties:
        enabled:
          description: The stored setting — what the HTTP/3 listener will do after the next restart.
          type: boolean
        active:
          description: >-
            Server-reported, ignored on write: whether this process is serving DoH
            over HTTP/3 right now. The listener binds at startup, so it does not
            follow `enabled` until the process restarts.
          type: boolean
        restart_required:
          description: >-
            Server-reported, ignored on write: true when `enabled` and `active`
            disagree and a restart would close the gap. False when the disagreement
            is caused by `unavailable_reason`, which a restart alone would not fix.
          type: boolean
        unavailable_reason:
          description: >-
            Server-reported, ignored on write: why the HTTP/3 listener cannot bind
            in this process regardless of `enabled`. Absent when nothing stands in
            its way.
          type: string

    HTTP3SettingsInput:
      type: object
      required: [enabled]
      properties:
        enabled:
          description: >-
            Serve DNS-over-HTTPS over HTTP/3 (RFC 9114) on the UDP counterparts of
            `ports.https`. Applied at the next restart.
          type: boolean

    UpstreamGroup:
      type: object
      required: [id, name, slug]
      properties:
        id:
          type: integer
        name:
          type: string
        slug:
          type: string

    UpstreamServer:
      type: object
      required: [id, group_name, url, position, enabled]
      properties:
        id:
          type: integer
        group_name:
          type: string
        url:
          type: string
          description: >-
            Upstream server in `[net:]host[:port][/path][#commonName]` form, or a
            DNS stamp (`sdns://...`). Supported `net` prefixes are `tcp+udp`
            (default when omitted), `tcp-tls`, `https:` and `quic:`. For the
            latter two the `//` after the colon is optional, so `quic://dns.adguard.com`
            is accepted as well (AdGuard compatibility).
          example: quic:dns.adguard.com
        position:
          type: integer
        enabled:
          type: boolean

    UpstreamServerInput:
      type: object
      required: [url, enabled]
      properties:
        url:
          type: string
          description: >-
            Upstream server in `[net:]host[:port][/path][#commonName]` form, or a
            DNS stamp (`sdns://...`). Supported `net` prefixes are `tcp+udp`
            (default when omitted), `tcp-tls`, `https:` and `quic:`. For the
            latter two the `//` after the colon is optional, so `quic://dns.adguard.com`
            is accepted as well (AdGuard compatibility).
          example: quic:dns.adguard.com
        position:
          type: integer
        enabled:
          type: boolean

    UpstreamSettings:
      type: object
      required: [strategy, timeout, user_agent, init_strategy]
      properties:
        strategy:
          type: string
          enum: [parallel_best, strict, random]
        timeout:
          type: string
        user_agent:
          type: string
        init_strategy:
          type: string
          enum: [blocking, failOnError, fast]

    UpstreamSettingsInput:
      type: object
      required: [strategy, timeout, user_agent, init_strategy]
      properties:
        strategy:
          type: string
          enum: [parallel_best, strict, random]
        timeout:
          type: string
        user_agent:
          type: string
        init_strategy:
          type: string
          enum: [blocking, failOnError, fast]

    ApplyResponse:
      type: object
      required: [status, message]
      properties:
        status:
          type: string
          enum: [ok, error]
        message:
          type: string
        error:
          type: string

    QueryLogHistoryPage:
      type: object
      required: [entries]
      properties:
        entries:
          type: array
          items:
            $ref: '#/components/schemas/QueryLogHistoryEntry'
        next_cursor:
          type: string
          description: >
            Pass back as `cursor` to fetch the next page. Absent on the last
            page.

    QueryLogHistoryEntry:
      type: object
      description: >
        One persisted query. Field names match the live log stream's entry
        fields so both views of the log render through the same columns.
      required:
        - timestamp
        - client_ip
        - client_names
        - client_group
        - duration_ms
        - question_type
        - question_name
        - response_code
        - response_reason
        - response_type
        - blocked
      properties:
        timestamp:
          type: string
          format: date-time
        client_ip:
          type: string
        client_names:
          type: string
          description: Resolved client names, "; "-joined as stored
        client_group:
          type: string
        duration_ms:
          type: integer
          format: int64
        question_type:
          type: string
        question_name:
          type: string
        response_code:
          type: string
        response_reason:
          type: string
        response_type:
          type: string
        answer:
          type: string
        blocked:
          type: boolean
          description: Blocked by policy; true exactly when response_type is BLOCKED

    ErrorResponse:
      type: object
      required: [message]
      properties:
        message:
          type: string
