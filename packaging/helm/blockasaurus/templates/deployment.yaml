{{- include "blockasaurus.validateQueryLogVolume" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "blockasaurus.fullname" . }}
  labels:
    {{- include "blockasaurus.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "blockasaurus.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "blockasaurus.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "blockasaurus.serviceAccountName" . }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if and .Values.queryLogVolume.enabled (eq .Values.queryLogVolume.type "hostPath") }}
      {{- $owner := include "blockasaurus.queryLogOwner" . }}
      initContainers:
        # The kubelet creates a DirectoryOrCreate hostPath as root:root 0755 and
        # does not apply fsGroup to hostPath volumes, so without this the
        # non-root main container cannot write the database. Idempotent: an
        # existing directory keeps its contents, which is what makes the query
        # log survive a pod restart.
        - name: querylog-dir
          image: "{{ .Values.queryLogVolume.hostPath.initImage.repository }}:{{ .Values.queryLogVolume.hostPath.initImage.tag }}"
          imagePullPolicy: {{ .Values.queryLogVolume.hostPath.initImage.pullPolicy }}
          command:
            - sh
            - -c
            - chown {{ $owner }} {{ .Values.queryLogVolume.mountPath | quote }} && chmod 0750 {{ .Values.queryLogVolume.mountPath | quote }}
          securityContext:
            # Root only to chown, and only on this one mount. Everything else is
            # dropped, including the ability to regain privileges.
            runAsUser: 0
            runAsGroup: 0
            runAsNonRoot: false
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              add:
                - CHOWN
              drop:
                - ALL
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 32Mi
          volumeMounts:
            - name: querylog
              mountPath: {{ .Values.queryLogVolume.mountPath }}
      {{- end }}
      containers:
        - name: blockasaurus
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          args:
            - --config
            - /app/config.yml
          ports:
            - name: dns-tcp
              containerPort: 53
              protocol: TCP
            - name: dns-udp
              containerPort: 53
              protocol: UDP
            - name: http
              containerPort: {{ .Values.service.http.port }}
              protocol: TCP
            {{- if .Values.service.adminPort.enabled }}
            - name: admin
              containerPort: {{ .Values.service.adminPort.port }}
              protocol: TCP
            {{- end }}
            {{- if .Values.tls.enabled }}
            - name: https
              containerPort: {{ .Values.config.ports.https | default 443 }}
              protocol: TCP
            - name: dot
              containerPort: 853
              protocol: TCP
            - name: doq
              containerPort: 853
              protocol: UDP
            {{- end }}
          livenessProbe:
            exec:
              command:
                - /app/blockasaurus
                - healthcheck
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            exec:
              command:
                - /app/blockasaurus
                - healthcheck
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: config
              mountPath: /app/config.yml
              subPath: config.yml
              readOnly: true
            {{- if .Values.persistence.enabled }}
            - name: data
              mountPath: /data
            {{- end }}
            {{- if .Values.queryLogVolume.enabled }}
            - name: querylog
              mountPath: {{ .Values.queryLogVolume.mountPath }}
            {{- end }}
            {{- if .Values.tls.enabled }}
            - name: tls-certs
              mountPath: {{ .Values.tls.mountPath }}
              readOnly: true
            {{- end }}
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: {{ include "blockasaurus.fullname" . }}
        {{- if .Values.persistence.enabled }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "blockasaurus.fullname" . }}
        {{- end }}
        {{- if .Values.queryLogVolume.enabled }}
        - name: querylog
          {{- if eq .Values.queryLogVolume.type "hostPath" }}
          hostPath:
            path: {{ .Values.queryLogVolume.hostPath.path }}
            # Created on first start, so there is nothing to provision by hand.
            type: DirectoryOrCreate
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- end }}
        {{- if .Values.tls.enabled }}
        - name: tls-certs
          secret:
            secretName: {{ .Values.tls.secretName }}
        {{- end }}
        - name: tmp
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
