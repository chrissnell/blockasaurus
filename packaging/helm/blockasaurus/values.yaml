replicaCount: 1

image:
  repository: ghcr.io/chrissnell/blockasaurus
  tag: ""  # defaults to appVersion
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# Blocky configuration — written to /app/config.yml in the pod.
# See https://0xerr0r.github.io/blocky/ for all options.
config:
  ports:
    dns: 53
    http: 80
  # Upstream DNS servers are managed in the SQLite config store via the web UI
  # (Upstreams / Upstream Settings pages). A fresh DB is seeded with a "default"
  # group containing 1.1.1.1 and 1.0.0.1.
  # Persistent config store for the web UI
  databasePath: /data/blocky.db
  # Query log. The sqlite target is what the web UI's Logs -> History tab
  # searches; any other type leaves that tab reporting it is unavailable.
  # The target lives on the node-local queryLogVolume below, not on the config
  # PVC -- see the comment there for why.
  queryLog:
    type: sqlite
    target: /querylog/querylog.db
    logRetentionDays: 30
  # Optional on-disk cache for downloaded blocklists. Left unset, downloads are
  # stateless: nothing is written to disk and every refresh pulls each source in
  # full. Point cachePath at a writable directory on the persistence volume below
  # (the container runs as UID 100) and blocky revalidates with If-None-Match /
  # If-Modified-Since, falls back to the cached copy when a source is unreachable,
  # and - with loading.strategy: fast - seeds the lists from disk at startup so it
  # answers queries without waiting for the downloads. Size the volume for the
  # uncompressed total of your sources, roughly doubled while a refresh is writing
  # its temp files. Orphaned files are not pruned when a source URL is removed or
  # changed, so clear the directory by hand after reworking your blocklists.
  #
  # blocking:
  #   loading:
  #     strategy: fast
  #     downloads:
  #       cachePath: /data/list-cache

# --- Client Group Endpoints ---
# Per-client-group DNS identification via hostname, path, or EDNS CPE-ID.
# Client groups are created in the web UI; each group gets a DNS-safe slug
# derived from its name (e.g., "Kids Devices" → "kids-devices").
# See docs/client_group_endpoints.md for full details.
#
# Scenario 1: Homelab — no TLS, .local or LAN IP
#   Clients identified by source IP/CIDR, EDNS CPE-ID, or DoH URL path.
#
#   config:
#     clientGroupEndpoints:
#       cpeId: true
#
# Scenario 2: Homelab with self-signed wildcard cert (.local)
#   Adds subdomain-based DoH/DoT.
#
#   tls:
#     enabled: true
#     secretName: blockasaurus-tls
#   config:
#     clientGroupEndpoints:
#       domains:
#         - blockasaurus.local
#       advertiseAddress: auto
#       cpeId: true
#     ports:
#       dns: 53
#       http: 80
#       https: 443
#       tls: 853
#     certFile: /certs/tls.crt
#     keyFile: /certs/tls.key
#   service:
#     dns:
#       dot: true
#       http: true
#       https: true
#
# Scenario 3: Custom domain with wildcard cert (production)
#   Full setup — all protocols on one LoadBalancer IP. With advertiseAddress,
#   blockasaurus auto-creates DNS records from its LB IP — no external DNS
#   records or ingress needed.
#
#   certificate:
#     enabled: true
#     issuerRef:
#       name: letsencrypt-dns01-cloudflare
#       kind: ClusterIssuer
#     dnsNames:                        # BOTH base + wildcard required
#       - dns.example.com              # for https://dns.example.com
#       - "*.dns.example.com"          # for per-group subdomains
#   tls:
#     enabled: true
#     secretName: blockasaurus-tls
#   config:
#     clientGroupEndpoints:
#       domains:
#         - dns.example.com
#       advertiseAddress: auto
#       cpeId: true
#     ports:
#       dns: 53
#       http: 80
#       https: 443
#       tls: 853
#     certFile: /certs/tls.crt
#     keyFile: /certs/tls.key
#   service:
#     dns:
#       externalTrafficPolicy: Local   # preserves client source IPs
#       dot: true
#       http: true
#       https: true
#   For external-facing DoH with a private admin UI, see Scenario 4 below.
#
# Scenario 4: Separate admin and DNS server ports
#   DoH exposed on the LB; admin UI restricted to a separate ClusterIP.
#   Use this when DoH is internet-facing and the web UI should not be.
#
#   config:
#     ports:
#       dns: 53
#       http: 80          # DNS server only (internet-facing)
#       https: 443        # DNS server only (internet-facing)
#       adminPort: 8080   # Web UI, API, metrics (internal)
#       tls: 853
#     certFile: /certs/tls.crt
#     keyFile: /certs/tls.key
#   service:
#     dns:
#       externalTrafficPolicy: Local
#       dot: true
#       http: true        # DoH on the LoadBalancer (no UI)
#       https: true       # DoH on the LoadBalancer (no UI)
#     adminPort:
#       enabled: true     # Admin UI on a separate ClusterIP
#       type: ClusterIP
#       port: 8080
#
#   Note: When adminPort is active, prometheus.io/port should be set to the
#   admin port (e.g., "8080") since /metrics moves there.

# cert-manager Certificate resource — creates a TLS cert automatically.
# Requires cert-manager to be installed in the cluster.
# IMPORTANT: dnsNames must include BOTH the base domain and the wildcard.
# A wildcard cert (*.dns.example.com) does NOT cover the bare domain.
certificate:
  enabled: false
  # issuerRef:
  #   name: letsencrypt-dns01-cloudflare
  #   kind: ClusterIssuer
  # dnsNames:
  #   - dns.example.com         # base domain
  #   - "*.dns.example.com"     # wildcard for per-group subdomains
  # secretName: ""            # defaults to <fullname>-tls
  # commonName: ""
  # duration: 2160h           # 90 days
  # renewBefore: 360h         # 15 days before expiry
  # subject:
  #   organizations:
  #     - My Org
  # privateKey:
  #   algorithm: RSA
  #   size: 2048

# TLS certificate for DoT/DoH/DoQ — mounts a k8s TLS Secret into the pod
tls:
  enabled: false
  secretName: ""          # Name of k8s TLS Secret (must contain tls.crt + tls.key)
  mountPath: /certs       # Where to mount the cert files in the pod

# Persistent volume for the config database
persistence:
  enabled: true
  storageClass: ""
  accessMode: ReadWriteOnce
  size: 256Mi

# Volume for the SQLite query log (config.queryLog below).
#
# Node-local by default, and deliberately not on the config PVC. The two have
# nothing in common: the config database is small, precious and rarely written,
# while the query log is append-heavy, bulky (~18 MB/day at 46k queries/day) and
# entirely disposable. Keeping it off shared/network storage means a slow or
# flaky backing store cannot push back on the write path, and means the config
# volume does not have to be sized for a retention window.
#
# Losing the query log when the pod moves to another node is the accepted
# trade-off: it is history, not state -- nothing in DNS resolution depends on it,
# and the writer recreates the database on first use.
queryLogVolume:
  enabled: true

  # Where the volume is mounted. Point config.queryLog.target at a file inside
  # this directory; the chart refuses to render if it does not (see
  # templates/_helpers.tpl).
  mountPath: /querylog

  # hostPath  a directory on the node, created if it does not exist. Survives
  #           pod restarts and node reboots; gone when the pod lands on a
  #           different node. REQUIRES a namespace that permits hostPath --
  #           Pod Security "baseline" and "restricted" both forbid it, so the
  #           namespace needs pod-security.kubernetes.io/enforce: privileged.
  # emptyDir  node-local scratch managed by the kubelet. Needs no PodSecurity
  #           exemption and no init container, but is recreated empty on every
  #           pod restart, not just on a node change.
  type: hostPath

  hostPath:
    # Must sit under a writable path on the node. On Talos, /var/lib is writable
    # and persists across reboots, while /var/mnt is read-only unless a disk is
    # mounted there -- a DirectoryOrCreate hostPath under /var/mnt fails to
    # mount with EROFS.
    path: /var/lib/blockasaurus-querylog

    # The kubelet creates a DirectoryOrCreate hostPath as root:root 0755, and
    # fsGroup is NOT applied to hostPath volumes, so a container running as a
    # non-root user cannot write to it. This init container fixes the ownership
    # once per pod start; it is idempotent, so an existing directory and its
    # contents are left in place. It needs its own image because the application
    # image is FROM scratch and has no shell or chown.
    #
    # It runs as root with two capabilities, both load-bearing:
    #
    #   CHOWN   the chown itself.
    #   FOWNER  the chmod. Once the chown has handed the directory to UID 100,
    #           UID 0 no longer owns it, and chmod on a file you do not own
    #           needs FOWNER. Without it the chmod fails "Operation not
    #           permitted" on every run and the init container crashloops.
    #
    # The 0750 is not cosmetic: SQLite creates the database file 0644, so at the
    # kubelet's default 0755 any UID on the node could read every client IP and
    # every domain the network resolved. The directory mode is the only lever --
    # SQLite does not expose the file mode.
    #
    # The chown is fatal and the chmod is not. The resolver does not need this
    # directory at all: when the query log target is unusable the writer falls
    # back to the console writer and DNS keeps serving. A hardening step must
    # not be able to stop the only resolver on the network from starting.
    #
    # Not used when type is emptyDir: the kubelet applies fsGroup there.
    initImage:
      repository: busybox
      tag: stable-musl
      pullPolicy: IfNotPresent

# DNS service — exposed via LoadBalancer (MetalLB)
service:
  dns:
    enabled: true
    type: LoadBalancer
    port: 53
    # Set to a specific IP if using MetalLB address pools
    loadBalancerIP: ""
    annotations: {}
    #   metallb.universe.tf/address-pool: dns
    dot: false            # Expose DoT port 853/TCP on the LB
    doq: false            # Expose DoQ port 853/UDP on the LB
    http: false           # Expose HTTP (web UI) on the LB
    https: false          # Expose HTTPS (DoH + web UI) on the LB
    admin: false          # Expose admin port on the LB (requires adminPort to be configured)

  # HTTP service — separate ClusterIP for internal access.
  # Not needed if service.dns.http is true (web UI on the LB).
  http:
    enabled: true
    type: ClusterIP
    port: 80

  # Admin port service — serves the web UI, API, and metrics on a separate port
  # from the DNS server endpoint. Use for external-facing deployments where DoH
  # is internet-exposed but the admin UI should remain internal.
  # Requires config.ports.adminPort (or adminPortTLS) to be set.
  # See Scenario 4 above and docs/client_group_endpoints.md for details.
  adminPort:
    enabled: false
    type: ClusterIP
    port: 8080

# Ingress — not needed when using service.dns.http/https on the LB.
# Useful if you don't have a LoadBalancer (e.g., bare metal without MetalLB).
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: blockasaurus.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

  # Admin ingress — exposes the admin UI via a separate ingress.
  # Useful for LAN access to the web UI when DoH is on a LoadBalancer.
  admin:
    enabled: false
    className: ""
    annotations: {}
    hosts:
      - host: blockasaurus.local
        paths:
          - path: /
            pathType: Prefix

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  fsGroup: 100

securityContext:
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 100
  runAsGroup: 100
  capabilities:
    add:
      - NET_BIND_SERVICE
    drop:
      - ALL

resources: {}
  # requests:
  #   cpu: 100m
  #   memory: 128Mi
  # limits:
  #   memory: 256Mi

nodeSelector: {}
tolerations: []
affinity: {}
